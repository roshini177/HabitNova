<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitNova | Nova Insights Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --primary: #06b6d4; --bg: #050505; --card: #0c0c0c; --text: #e2e8f0; }
        body.company-theme { --primary: #818cf8; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navigation */
        .sidebar { width: 90px; background: #000; border-right: 1px solid #111; display: flex; flex-direction: column; align-items: center; padding: 40px 0; }
        .sidebar nav a { color: #333; text-decoration: none; margin-bottom: 35px; font-size: 22px; display: block; transition: 0.3s; }
        .sidebar nav a.active { color: var(--primary); text-shadow: 0 0 15px var(--primary); }

        /* Main Content Layout */
        .main { flex: 1; padding: 40px 60px; overflow-y: auto; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 300; letter-spacing: -1px; }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #151515; }
        .stat-card span { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; display: block; margin-bottom: 8px; }
        .stat-card h2 { font-size: 24px; font-weight: 700; color: #fff; }

        .content-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; }
        .panel { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #151515; display: flex; flex-direction: column; }

        /* Balance Meter UI */
        .meter-container { margin-top: 20px; }
        .meter-bg { background: #1a1a1a; height: 10px; border-radius: 10px; margin: 15px 0; overflow: hidden; display: flex; }
        #personal-bar { background: #06b6d4; height: 100%; transition: 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        #company-bar { background: #818cf8; height: 100%; transition: 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        /* AI Insight Styling */
        .insight-box { margin-top: auto; padding: 25px; border-radius: 16px; background: #000; border-left: 4px solid var(--primary); }
        .insight-box h4 { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .insight-text { font-size: 14px; line-height: 1.6; color: #888; }
        .insight-highlight { color: #fff; font-weight: 600; }
    </style>
</head>
<body id="body-tag">

<aside class="sidebar">
    <nav>
        <a href="dashboard.html">🏠</a>
        <a href="analytics.html" class="active">📊</a>
        <a href="add-habit.html">⚙️</a>
    </nav>
</aside>

<main class="main">
    <div class="header">
        <h1>Nova Analytics</h1>
        <p style="color: #444; font-size: 12px; margin-top: 5px;">ACTIVE DATA STREAM: <span id="mode-label" style="color: var(--primary); font-weight: 700; text-transform: uppercase;"></span></p>
    </div>

    <div class="stat-grid">
        <div class="stat-card"><span>Completion</span><h2 id="total-completion">0%</h2></div>
        <div class="stat-card"><span>Active Missions</span><h2 id="active-tasks">0</h2></div>
        <div class="stat-card"><span>Diversity</span><h2 id="diversity-score">0/3</h2></div>
        <div class="stat-card"><span>System State</span><h2 id="mode-display" style="text-transform: capitalize;">-</h2></div>
    </div>

    <div class="content-grid">
        <div class="panel">
            <h3 style="font-weight: 400; margin-bottom: 20px;">Mode Symmetry</h3>
            <canvas id="radarChart"></canvas>
        </div>

        <div class="panel">
            <h3 style="font-weight: 400;">Global Equilibrium</h3>
            <p style="font-size: 12px; color: #444; margin-top: 5px;">Work vs. Wellness Ratio</p>
            
            <div class="meter-container">
                <div class="meter-bg">
                    <div id="personal-bar" style="width: 50%;"></div>
                    <div id="company-bar" style="width: 50%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; letter-spacing: 1px;">
                    <span style="color: #06b6d4;">PERSONAL</span>
                    <span style="color: #818cf8;">COMPANY</span>
                </div>
            </div>

            <div class="insight-box">
                <h4>✨ Nova Engine Diagnostic</h4>
                <div id="ai-insight-content" class="insight-text">
                    Initializing diagnostic routines...
                </div>
            </div>
        </div>
    </div>
</main>

<script>
const mode = localStorage.getItem("habitnova_mode") || "personal";
const config = {
    personal: { cats: ['health', 'fitness', 'mindset'], color: '#06b6d4', accent: 'rgba(6, 182, 212, 0.2)' },
    company: { cats: ['project', 'skills', 'work'], color: '#818cf8', accent: 'rgba(129, 140, 248, 0.2)' }
};

if(mode === 'company') {
    document.getElementById('body-tag').classList.add('company-theme');
}
document.getElementById('mode-label').innerText = mode;
document.getElementById('mode-display').innerText = mode;

function initAnalytics() {
    const habits = JSON.parse(localStorage.getItem(`habits_${mode}`) || '[]');
    const pData = JSON.parse(localStorage.getItem('habits_personal') || '[]');
    const cData = JSON.parse(localStorage.getItem('habits_company') || '[]');

    // 1. TOP STATS
    const completed = habits.filter(h => h.completed).length;
    const ratio = habits.length > 0 ? Math.round((completed / habits.length) * 100) : 0;
    document.getElementById('total-completion').innerText = ratio + '%';
    document.getElementById('active-tasks').innerText = habits.length;

    // 2. SPIDER CHART CALCULATION
    const currentCats = config[mode].cats;
    const catPoints = currentCats.map(cat => {
        const catHabits = habits.filter(h => h.category.toLowerCase() === cat.toLowerCase());
        if(catHabits.length === 0) return 0;
        const catDone = catHabits.filter(h => h.completed).length;
        return Math.round((catDone / catHabits.length) * 100);
    });

    document.getElementById('diversity-score').innerText = currentCats.filter(c => habits.some(h => h.category.toLowerCase() === c)).length + "/3";

    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: currentCats.map(c => c.toUpperCase()),
            datasets: [{
                data: catPoints,
                backgroundColor: config[mode].accent,
                borderColor: config[mode].color,
                pointBackgroundColor: config[mode].color,
                borderWidth: 2
            }]
        },
        options: {
            scales: { r: { min: 0, max: 100, grid: { color: '#151515' }, angleLines: { color: '#151515' }, pointLabels: { color: '#444', font: { size: 11, weight: '700' } }, ticks: { display: false } } },
            plugins: { legend: { display: false } }
        }
    });

    // 3. DUAL-LAYER NOVA INSIGHTS
    const pDone = pData.filter(h => h.completed).length;
    const cDone = cData.filter(h => h.completed).length;
    const totalDone = pDone + cDone;
    
    const insightContent = document.getElementById('ai-insight-content');
    let modeMsg = "";
    let balanceMsg = "";

    // LAYER 1: Mode-Specific Insight (Internal Analysis)
    const minVal = Math.min(...catPoints);
    const weakestCat = currentCats[catPoints.indexOf(minVal)];
    
    if (habits.length === 0) {
        modeMsg = `The <b>${mode.toUpperCase()}</b> buffer is currently empty. Please initialize missions to begin analysis.`;
    } else if (minVal < 50) {
        modeMsg = `Internal Analysis: Your <span class="insight-highlight">${weakestCat.toUpperCase()}</span> performance is lower than the mode average. Focus here to improve core stability.`;
    } else {
        modeMsg = `Internal Analysis: High-level symmetry detected in <b>${mode.toUpperCase()}</b> missions. All sectors are performing optimally.`;
    }

    // LAYER 2: Global Equilibrium (Balance Meter Analysis)
    if (totalDone > 0) {
        const pWidth = (pDone / totalDone) * 100;
        const cWidth = (cDone / totalDone) * 100;
        document.getElementById('personal-bar').style.width = pWidth + "%";
        document.getElementById('company-bar').style.width = cWidth + "%";

        if (pWidth > 70) {
            balanceMsg = "Global Diagnostic: Severe tilt toward <b>Wellness</b>. Ensure professional milestones are not being deprioritized.";
        } else if (cWidth > 70) {
            balanceMsg = "Global Diagnostic: <b>High Burnout Risk</b>. System is over-leveraged in Work execution. Switch to Personal mode to recharge.";
        } else {
            balanceMsg = "Global Diagnostic: <b>Perfect Equilibrium</b>. Personal and Professional datasets are perfectly synchronized.";
        }
    } else {
        balanceMsg = "Equilibrium Meter: Awaiting data from both sectors.";
    }

    // FINAL OUTPUT MERGE
    insightContent.innerHTML = `${modeMsg}<br><br><span style="color:#555; font-size:13px;">${balanceMsg}</span>`;
}

window.onload = initAnalytics;
</script>
</body>
</html>
