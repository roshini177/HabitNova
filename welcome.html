<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HabitNova Welcome</title>
    <style>
        /* Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', Arial, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top, #1b2a3a, #0b1118); color: white; transition: 0.5s; }
        body.company-mode { background: radial-gradient(circle at top, #1e1b4b, #0b1118); }

        /* Card & Content */
        .card { width: 420px; background: rgba(10, 18, 28, 0.95); border-radius: 16px; padding: 40px; text-align: center; border: 1px solid #1f2a36; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Mode Switcher */
        .mode-switcher { display: flex; background: #0b1118; padding: 4px; border-radius: 30px; margin-bottom: 30px; border: 1px solid #1f2a36; }
        .mode-btn { flex: 1; padding: 12px; border-radius: 25px; cursor: pointer; font-size: 0.75rem; color: #9aa4af; background: transparent; border: none; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1da1f2; color: #0b1118; }
        .company-mode .mode-btn.active { background: #818cf8; }

        /* Buttons */
        .login-btn { width: 100%; padding: 14px; border-radius: 25px; border: none; background: #1da1f2; color: #0b1118; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .login-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .company-mode .login-btn { background: #818cf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="mode-switcher">
        <button class="mode-btn active" id="btn-personal" onclick="switchMode('personal')">PERSONAL</button>
        <button class="mode-btn" id="btn-company" onclick="switchMode('company')">COMPANY</button>
    </div>

    <h1 id="login-title" style="font-size: 2.2rem; margin-bottom: 10px;">HabitNova</h1>
    <p id="login-subtitle" style="color: #9aa4af; margin-bottom: 35px; line-height: 1.4;">
        Ignite your habits and keep the momentum going.
    </p>

    <button class="login-btn" onclick="handleLogin()">Continue →</button>
</div>

<script>
    let currentMode = 'personal';

    function switchMode(mode) {
        currentMode = mode;
        document.body.classList.toggle('company-mode', mode === 'company');
        document.getElementById('btn-personal').classList.toggle('active', mode === 'personal');
        document.getElementById('btn-company').classList.toggle('active', mode === 'company');
        
        const title = document.getElementById('login-title');
        title.innerText = mode === 'company' ? 'HabitNova Business' : 'HabitNova';
    }

    function handleLogin() {
        localStorage.setItem("habitnova_mode", currentMode);
        if(currentMode === 'personal') {
            localStorage.setItem("habitnova_role", "user");
            window.location.href = "dashboard.html";
        } else {
            const role = prompt("Enter Role (admin / leader / employee):").toLowerCase();
            if(['admin', 'leader', 'employee'].includes(role)) {
                localStorage.setItem("habitnova_role", role);
                window.location.href = "dashboard.html";
            } else { 
                alert("Invalid Role. Please enter admin, leader, or employee."); 
            }
        }
    }
</script>

</body>
</html>
