<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HabitNova | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #06b6d4; --bg: #050505; --card: #0c0c0c; --sidebar: #000; }
        body.company-theme { --primary: #818cf8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 90px; background: var(--sidebar); border-right: 1px solid #111; display: flex; flex-direction: column; align-items: center; padding: 40px 0; }
        .sidebar nav a { color: #333; text-decoration: none; margin-bottom: 35px; font-size: 22px; display: block; transition: 0.3s; }
        .sidebar nav a.active { color: var(--primary); text-shadow: 0 0 15px var(--primary); }

        /* Main Content */
        .main-content { flex: 1; padding: 60px; overflow-y: auto; }
        .header-area { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
        
        #streak-count { font-size: 48px; font-weight: 800; color: var(--primary); line-height: 1; }
        .streak-label { font-size: 9px; color: #444; letter-spacing: 2px; font-weight: 800; margin-top: 5px; text-transform: uppercase; }

        /* Habit Cards */
        .habit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .habit-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #151515; transition: 0.3s; position: relative; }
        .habit-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        .cat-tag { font-size: 9px; color: var(--primary); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .status-btn { width: 100%; margin-top: 25px; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 11px; transition: 0.3s; }
        .btn-pending { background: #1a1a1a; color: #555; }
        .btn-done { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

        .card-controls { position: absolute; top: 25px; right: 25px; display: flex; gap: 10px; opacity: 0.3; transition: 0.3s; }
        .habit-card:hover .card-controls { opacity: 1; }
        .control-btn { cursor: pointer; font-size: 14px; background: none; border: none; color: #fff; }
    </style>
</head>
<body>

<aside class="sidebar">
    <nav>
        <a href="dashboard.html" class="active">🏠</a>
        <a href="calendar.html">🌿</a>
        <a href="analytics.html">📊</a>
        <a href="add-habit.html">⚙️</a>
    </nav>
</aside>

<main class="main-content">
    <div class="header-area">
        <div>
            <h1 id="mode-title" style="font-weight: 300; font-size: 32px;">Personal Missions</h1>
            <p style="color: #444; font-size: 11px; margin-top: 8px; letter-spacing: 1px;">NOVA CORE: ONLINE</p>
        </div>
        <div style="text-align: right;">
            <div id="streak-count">0</div>
            <p class="streak-label">Day Streak 🔥</p>
        </div>
    </div>
    <div id="habit-grid" class="habit-grid"></div>
</main>

<script>
    const mode = localStorage.getItem("habitnova_mode") || "personal";
    const STORAGE_KEY = `habits_${mode}`;
    const STREAK_KEY = `streak_history_${mode}`;

    if(mode === 'company') {
        document.body.classList.add('company-theme');
        document.getElementById('mode-title').innerText = "Company Missions";
    }

    function getHabits() {
        let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        if (data.length === 0) {
            data = mode === 'personal' ? [
                { id: 101, name: "Screen Break (20-20-20)", category: "health", completed: false },
                { id: 102, name: "Focus Session Prep", category: "mindset", completed: true },
                { id: 103, name: "Stretching Interval", category: "fitness", completed: false }
            ] : [
                { id: 201, name: "Commit Progress (Git)", category: "project", completed: false },
                { id: 202, name: "Shortcut Mastery", category: "skills", completed: true },
                { id: 203, name: "Workspace Reset", category: "work", completed: false }
            ];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        return data;
    }

    function calculateStreak() {
        let history = JSON.parse(localStorage.getItem(STREAK_KEY)) || {};
        let streak = 0;
        let d = new Date();
        while(true) {
            let s = d.toISOString().split('T')[0];
            if(history[s]) { streak++; d.setDate(d.getDate()-1); }
            else break;
        }
        document.getElementById('streak-count').innerText = streak;
    }

    function render() {
        const habits = getHabits();
        document.getElementById('habit-grid').innerHTML = habits.map(h => `
            <div class="habit-card">
                <div class="card-controls">
                    <button class="control-btn" onclick="editHabit(${h.id})">✏️</button>
                    <button class="control-btn" onclick="deleteHabit(${h.id})">🗑️</button>
                </div>
                <span class="cat-tag">${h.category}</span>
                <h3 style="font-size:18px; font-weight:500;">${h.name}</h3>
                <button class="status-btn ${h.completed ? 'btn-done' : 'btn-pending'}" onclick="toggle(${h.id})">
                    ${h.completed ? 'MISSION ARCHIVED' : 'SYNC PROGRESS'}
                </button>
            </div>
        `).join('');
    }

    function toggle(id) {
        let habits = getHabits();
        const h = habits.find(x => x.id === id);
        if(h) {
            h.completed = !h.completed;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
            
            let history = JSON.parse(localStorage.getItem(STREAK_KEY)) || {};
            const today = new Date().toISOString().split('T')[0];
            if(habits.some(x => x.completed)) history[today] = true;
            else delete history[today];
            
            localStorage.setItem(STREAK_KEY, JSON.stringify(history));
            render();
            calculateStreak();
        }
    }

    function deleteHabit(id) {
        if(confirm("Permanently delete this mission?")) {
            let habits = getHabits();
            const filtered = habits.filter(h => h.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
            render();
        }
    }

    function editHabit(id) {
        let habits = getHabits();
        const habit = habits.find(h => h.id === id);
        if(habit) {
            const newName = prompt("Modify Mission Name:", habit.name);
            if(newName) {
                habit.name = newName;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
                render();
            }
        }
    }

    window.onload = () => { render(); calculateStreak(); };
</script>
</body>
</html>
